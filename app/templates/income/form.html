{% extends 'base.html' %}
{% block title %}{{ 'Edit' if income else 'Log' }} Income{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px;">
  <h2>{{ 'Edit income entry' if income else 'Log income' }}</h2>
  <form method="post">
    <label for="amount">Amount (₦)</label>
    <input type="number" step="0.01" min="0.01" name="amount" id="amount" value="{{ income['amount'] if income else '' }}" required>

    <label for="category_id">Category</label>
    <select name="category_id" id="category_id">
      <option value="">— None —</option>
      {% for c in categories %}
        <option value="{{ c['id'] }}" {% if income and income['category_id'] == c['id'] %}selected{% endif %}>{{ c['name'] }}</option>
      {% endfor %}
    </select>

    <label for="date">Date</label>
    <input type="date" name="date" id="date" value="{{ income['date'] if income else '' }}" required>

    <label for="note">Note (optional)</label>
    <input type="text" name="note" id="note" value="{{ income['note'] if income else '' }}" placeholder="e.g. Wholesale order - Adeyemi Stores">

    <button type="submit">{{ 'Save changes' if income else 'Log income' }}</button>
    <a class="btn" style="background: #6b7280;" href="{{ url_for('income.list_income') }}">Cancel</a>
  </form>
</div>
{% endblock %}
