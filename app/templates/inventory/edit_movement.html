{% extends 'base.html' %}
{% block title %}Correct Stock Entry{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px;">
  <h2>Correct stock entry — {{ item['name'] }}</h2>
  <p style="color: var(--muted); font-size: 0.85rem;">
    Original entry: <strong style="color: var(--text);">{{ '%+g'|format(movement['change_qty']) }}</strong> — {{ movement['reason'] }} ({{ movement['created_at'] }})
  </p>

  <form method="post">
    <label for="direction">Direction</label>
    <select name="direction" id="direction">
      <option value="add" {% if movement['change_qty'] > 0 %}selected{% endif %}>Add stock</option>
      <option value="remove" {% if movement['change_qty'] < 0 %}selected{% endif %}>Remove stock</option>
    </select>

    <label for="movement_type">Type</label>
    <select name="movement_type" id="movement_type">
      <option value="restock" {% if movement['movement_type'] == 'restock' %}selected{% endif %}>Restock (new stock received)</option>
      <option value="damage" {% if movement['movement_type'] == 'damage' %}selected{% endif %}>Damaged / spoiled (counts as a loss in reports)</option>
      <option value="correction" {% if movement['movement_type'] == 'correction' %}selected{% endif %}>Stock count correction</option>
    </select>

    <label for="amount">Quantity</label>
    <input type="number" step="0.01" min="0.01" name="amount" id="amount" value="{{ movement['change_qty'] if movement['change_qty'] > 0 else -movement['change_qty'] }}" required>

    <label for="reason">Reason / note</label>
    <input type="text" name="reason" id="reason" value="{{ movement['reason'] }}" required>

    <button type="submit">Save correction</button>
    <a class="btn" style="background: #6b7280;" href="{{ url_for('inventory.stock_history', item_id=item['id']) }}">Cancel</a>
  </form>
</div>
{% endblock %}
